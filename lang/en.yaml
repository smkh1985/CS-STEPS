language: English
# Kokoro (free) for the preview. For the final video: tts: elevenlabs, model: eleven_multilingual_v2,
# voices: {teacher: UgBBYS2sOqTuMpoF3BR0} (the instructor's clone), then record once.
tts: kokoro
kokoro_lang: a
voices:
  teacher: af_heart

overlay:
  intro_until: tour
  cards:
    - {step: cold_open, title: "Hello, World!", subtitle: "your first Python program",
       flow: ['print("Hello, World!")', "Python", "Hello, World!"]}
  sidebar:
    from: plan
    title: "TODAY"
    items:
      - {title: "Open a folder", sub: "lesson0", steps: [tour, select_folder]}
      - {title: "Create hello.py", sub: "a Python file", steps: [new_file, py_icon]}
      - {title: "Write & run", sub: "Ctrl + F5", steps: [write, shortcut]}
      - {title: "Understand print()", sub: "arguments, quotes, sep", steps: [function, apostrophe]}

lines:
  # --- Intro ------------------------------------------------------------------------------
  cold_open:
    text: "One line of code. That's all it takes to make your computer talk to you. Everything is installed, so no more setup. Today we roll up our sleeves, get our hands dirty, and write our very first Python program."
    chapter: Hello, World!
  plan:
    text: "Here's the plan. We'll get to know VS Code, create a folder for our code, add our first Python file, write one line, and run it. Then we'll take that line apart, so you really understand what you wrote. And remember: don't just watch. Code along with me."
    say: "Here's the plan. We'll get to know V S Code, create a folder for our code, add our first Python file, write one line, and run it. Then we'll take that line apart, so you really understand what you wrote. [pause 0.4] And remember: don't just watch. Code along with me."

  # --- Open a folder ----------------------------------------------------------------------
  tour:
    text: "This is VS Code. On the left is the sidebar, the big area in the middle is the editor, where we write our code, and the terminal will show up at the bottom."
    say: "This is V S Code. On the left is the sidebar, the big area in the middle is the editor, where we write our code, and the terminal will show up at the bottom."
    chapter: Open a folder
  open_folder:
    text: "In VS Code, we always work inside a folder. Open the File menu, and click Open Folder."
    say: "In V S Code, we always work inside a folder. Open the File menu, and click Open Folder."
    cues: ["File menu", "click Open Folder"]
  new_folder:
    text: "Let's make a new folder for this lesson in Documents. Click Documents on the left, then New folder, and call it lesson0, with no space."
    say: "Let's make a new folder for this lesson in Documents. Click Documents on the left, then New folder, and call it lesson zero, with no space."
    cues: ["Click Documents", "then New folder", "call it"]
  select_folder:
    text: "Then click Select Folder. VS Code opens our new, empty folder."
    say: "Then click Select Folder. V S Code opens our new, empty folder."
    cues: ["click Select Folder"]

  # --- hello.py ---------------------------------------------------------------------------
  new_file:
    text: "There's our folder in the Explorer. Hover over it, and click the New File icon. Call it hello.py."
    say: "There's our folder in the Explorer. Hover over it, and click the New File icon. Call it hello dot P Y."
    cues: ["Hover over it", "New File icon"]
    chapter: Create hello.py
  py_icon:
    text: "The .py ending is important: it tells VS Code that this is a Python file. See the little Python icon? VS Code got it."
    say: "The dot P Y ending is important: it tells V S Code that this is a Python file. See the little Python icon? V S Code got it."

  # --- Write and run ----------------------------------------------------------------------
  write:
    text: "And now, the moment you've been waiting for. Type print, open parenthesis, double quote, Hello, World!, double quote, close parenthesis."
    cues: ["Type print"]
    chapter: Write and run
  save:
    text: "See the white dot on the tab? That means the file isn't saved yet. Press Control S to save."
    cues: ["Press Control S"]
  run_menu:
    text: "Time to run it. Open the Run menu, and click Run Without Debugging."
    cues: ["Run menu", "click Run Without Debugging"]
  debugger:
    text: "The first time, VS Code asks which debugger to use. Choose Python Debugger. It only asks once."
    say: "The first time, V S Code asks which debugger to use. Choose Python Debugger. It only asks once."
    cues: ["Choose Python Debugger"]
  debugging_later:
    text: "Debugging is a powerful way to find mistakes in your code, and we'll learn it later in the course. For now, we just want to run."
  output:
    text: "VS Code first types a long command that starts Python with our file. Don't worry about it. Right below it: Hello, World!, printed in the terminal by our very own program."
    say: "V S Code first types a long command that starts Python with our file. Don't worry about it. [pause 0.3] Right below it: Hello, World!, printed in the terminal by our very own program."
  congrats:
    text: "One line of code, and the computer did exactly what we told it to. That's your first Python program. Congratulations!"
  shortcut:
    text: "Going through the menu every time is slow. Here's a shortcut worth learning: Control F5. It runs your file without debugging. Super easy."
    say: "Going through the menu every time is slow. Here's a shortcut worth learning: Control F 5. [pause 0.3] It runs your file without debugging. Super easy."
    cues: ["Control F 5."]

  # --- print() explained ------------------------------------------------------------------
  function:
    text: "Now let's understand what we wrote. print is a built-in Python function. Built-in means it comes with Python, ready to use."
    cues: ["print is"]
    chapter: What is print?
  machine:
    text: "A function is like a machine. You give it some inputs, it does some work with them, and sometimes it hands you back a result. The inputs we give a function are called arguments. print takes a message as its argument, and its job is to show that message in the terminal."
  parentheses:
    text: "To use a function, or as programmers say, to call it, you write its name, and then parentheses. Don't forget them! Without the parentheses, Python doesn't run the function, and nothing gets printed. Whatever we put inside the parentheses is what we give to the function."
  quotes_why:
    text: "But why is the message inside double quotes? Because it's text, and Python should print it exactly as it is. Text in quotes is called a string."
  quotes_literal:
    text: "When we write it straight into our code like this, it's a string literal: literally these characters. Without the quotes, Python would think Hello is the name of something in our program. You'll see the difference soon, when we learn about variables."

  # --- Single or double quotes ------------------------------------------------------------
  single_quotes:
    text: "And here's some good news: Python is not very strict about which quotes you use. Let's change the double quotes to single quotes, and run it again. Same result."
    cues: ["Let's change"]
    chapter: Single or double quotes
  quotes_match:
    text: "Just remember one rule: they have to match. If you open with a double quote, close with a double quote."
    cues: ["they have to match"]
  squiggle:
    text: "See the red squiggly line? That's VS Code telling you something is wrong, even before you run it. Let's fix it."
    say: "See the red squiggly line? That's V S Code telling you something is wrong, even before you run it. Let's fix it."
    cues: ["Let's fix it."]

  # --- More arguments, sep ----------------------------------------------------------------
  more_args:
    text: "I told you a function can take several inputs. So far we gave print just one. Let's give it three, separated with commas."
    cues: ["Let's give it three"]
    chapter: More than one argument
  more_args_result:
    text: "print took all three messages, and printed them on one line, with a space between each of them."
  sep_why:
    text: "But what if you want commas between them, instead of spaces? print is more powerful than it looks. It has another input, called the separator. If we just add a comma as another message, print thinks it's a fourth message to print. We have to say clearly: this one is the separator."
    chapter: The separator
  sep_how:
    text: "We do that by writing its name, sep, then equals, and the separator in quotes. Run it again."
    say: "We do that by writing its name, sep, then equals, and the separator in quotes. [pause 0.3] Run it again."
    cues: ["by writing its name"]
  sep_result:
    text: "It worked! The messages are separated with commas. But it looks a bit squashed."
  sep_space:
    text: "The separator can be any text you like, so let's use a comma and a space."
    cues: ["let's use"]
  sep_space_result:
    text: "Perfect. You decide exactly what goes between the messages."

  # --- More lines -------------------------------------------------------------------------
  more_lines:
    text: "One line is nice, but real programs have many lines. Let's call print two more times, and run it."
    cues: ["Let's call print"]
    chapter: More lines
  top_to_bottom:
    text: "Python runs your code from top to bottom, one line at a time, and every print starts on a new line."
  apostrophe:
    text: "And look at the last line: I'm has an apostrophe, which is a single quote. That's exactly why double quotes are handy here: the single quote inside doesn't end the string."

  # --- Wrap up ----------------------------------------------------------------------------
  recap:
    text: "Let's recap. You opened a folder in VS Code, created your first Python file, and ran it with Control F5. You learned that print is a function, that we give it arguments inside the parentheses, that text goes in matching quotes, and that sep controls what goes between the messages."
    say: "Let's recap. You opened a folder in V S Code, created your first Python file, and ran it with Control F 5. You learned that print is a function, that we give it arguments inside the parentheses, that text goes in matching quotes, and that sep controls what goes between the messages."
    chapter: Recap
  assignment:
    text: "Your turn! In the assignments folder of the GitHub repo, you'll find this lesson's challenge: print a short card about yourself: your name, your city, and why you're learning Python. Pause the video and try it yourself first, then check the solutions folder."
  outro:
    text: "In the next video, we'll learn about variables, and you'll finally see why those quotes matter so much. See you there!"
